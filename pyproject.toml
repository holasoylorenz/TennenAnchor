[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-control-harness"
version = "1.1.0"
description = "Stateful execution and verification runtime for Windows desktop computer-use agents."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Lorenz", email = "holasoylorenz@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "uiautomation>=2.0.19",
    "pyautogui>=0.9.54",
    "mss>=9.0.1",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
desktop-harness = "harness:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
