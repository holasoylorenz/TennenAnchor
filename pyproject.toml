[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tennenanchor"
version = "1.2.0"
description = "Closed-loop, state-verified Windows Computer-Use Runtime & MCP Server for AI agents — from EDA and CAD to any desktop application."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Lorenz Lindbichler", email = "holasoylorenz@users.noreply.github.com" }
]
requires-python = ">=3.10"
keywords = [
    "tennenanchor",
    "desktop-automation",
    "computer-use",
    "windows-automation",
    "model-context-protocol",
    "mcp",
    "mcp-server",
    "closed-loop-verification",
    "eda-automation",
    "ltspice",
    "agentic-ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "uiautomation>=2.0.19",
    "pyautogui>=0.9.54",
    "psutil>=5.9.0",
    "pywin32>=306",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
recording = [
    "mss>=9.0.1",
]

[project.urls]
Homepage = "https://github.com/holasoylorenz/tennenanchor"
Documentation = "https://github.com/holasoylorenz/tennenanchor#readme"
Repository = "https://github.com/holasoylorenz/tennenanchor.git"
Issues = "https://github.com/holasoylorenz/tennenanchor/issues"

[project.scripts]
tennenanchor = "harness:main"
desktop-harness = "harness:main"

[tool.setuptools]
packages = ["core", "actuation", "perception"]
py-modules = ["harness", "mcp_server"]

[tool.setuptools.package-data]
"*" = ["knowledge/**/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
